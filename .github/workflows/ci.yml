# The game needs nothing from the original to build, so CI links it on Windows and Linux, runs the
# tests that need no game data, and uploads each drop-in archive. A pushed version tag, such as
# 0.1.0, publishes both as a GitHub release whose notes give their SHA256.

name: ci

on:
  push:
    branches: ["**"]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: clang-format
        shell: bash
        run: |
          pip install clang-format==22.1.8
          git ls-files 'src/*.cpp' 'src/*.h' 'tests/*.cpp' | xargs clang-format --dry-run --Werror

  build:
    name: Build (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # CPM downloads once per dependency version; the key changes when cmake/dependencies.cmake does.
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Configure and build
        run: |
          cmake --preset msvc-x64
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --prefix package
          Compress-Archive -Path package/* -DestinationPath hyperblade_20XX.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: hyperblade_20XX
          path: hyperblade_20XX.zip

  build-linux:
    name: Build (GCC Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: .cpm-cache-linux
          key: cpm-linux-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Build, test and install in the Linux image
        run: |
          docker build -t hyperblade-linux -f docker/linux.Dockerfile docker
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/.cpm-cache-linux:/cpm" -v "$PWD/build-linux:/build" hyperblade-linux

      - name: Package
        run: tar -czf hyperblade_20XX-linux.tar.gz -C build-linux/package .

      - uses: actions/upload-artifact@v4
        with:
          name: hyperblade_20XX-linux
          path: hyperblade_20XX-linux.tar.gz

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [format, build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Release notes
        run: |
          {
            echo 'Unpack `hyperblade_20XX.zip` on Windows, or `hyperblade_20XX-linux.tar.gz` on Linux, into your HyperBlade folder beside `HYPERX.EXE`, and run `hyperblade_20XX`.'
            echo
            echo '| File | SHA256 |'
            echo '| --- | --- |'
            for file in hyperblade_20XX.zip hyperblade_20XX-linux.tar.gz; do
              echo "| \`$file\` | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
            done
            echo
            echo "Built from ${{ github.sha }}."
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            hyperblade_20XX.zip
            hyperblade_20XX-linux.tar.gz
          body_path: release-notes.md
          generate_release_notes: true
