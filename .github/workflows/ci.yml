# The exe needs nothing from the game to build, so CI links it, runs the tests that need no game
# data, and uploads the drop-in zip. A pushed version tag, such as 0.1.0, publishes that zip as a
# GitHub release whose notes give the SHA256 of the exe and the zip.

name: ci

on:
  push:
    branches: ["**"]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: clang-format
        shell: bash
        run: |
          pip install clang-format==22.1.8
          git ls-files 'src/*.cpp' 'src/*.h' 'tests/*.cpp' | xargs clang-format --dry-run --Werror

  build:
    name: Build (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # CPM downloads once per dependency version; the key changes when cmake/dependencies.cmake does.
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Configure and build
        run: |
          cmake --preset msvc-x64
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/out/hyperblade_20XX.exe, build/out/SDL3.dll package/
          Compress-Archive -Path package/* -DestinationPath hyperblade_20XX.zip -Force

          $exe = (Get-FileHash -Algorithm SHA256 package/hyperblade_20XX.exe).Hash.ToLower()
          $zip = (Get-FileHash -Algorithm SHA256 hyperblade_20XX.zip).Hash.ToLower()
          @(
              "Unzip into your HyperBlade folder, beside ``HYPERX.EXE``, and run ``hyperblade_20XX.exe``."
              ""
              "| File | SHA256 |"
              "| --- | --- |"
              "| ``hyperblade_20XX.exe`` | ``$exe`` |"
              "| ``hyperblade_20XX.zip`` | ``$zip`` |"
              ""
              "Built from ${{ github.sha }}."
          ) | Set-Content -Encoding utf8 release-notes.md

          Get-Content release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: hyperblade_20XX
          path: |
            hyperblade_20XX.zip
            release-notes.md

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [format, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hyperblade_20XX

      - uses: softprops/action-gh-release@v2
        with:
          files: hyperblade_20XX.zip
          body_path: release-notes.md
          generate_release_notes: true
