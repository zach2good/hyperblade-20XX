# The build reads resources out of your own copy of the game, which no hosted runner has, so CI
# compiles every source without linking an image, and checks the formatting.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: clang-format
        shell: bash
        run: |
          pip install clang-format==22.1.8
          git ls-files 'src/*.cpp' 'src/*.h' | xargs clang-format --dry-run --Werror

  compile:
    name: Compile (MSVC x86)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure and compile, without the game
        run: |
          cmake --preset msvc-x86 -DHYPERX_COMPILE_ONLY=ON
          cmake --build build
