# Every six hours, scores main against the private original and commits the README figures,
# the status card and a history row when they have moved. Pull requests leave all three alone.

name: figures

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: figures
  cancel-in-progress: false

jobs:
  figures:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Fetch the VC6 SP3 toolchain
        uses: actions/checkout@v5
        with:
          repository: zach2good/vc6-sp3-toolchain
          path: vc6

      - name: Fetch the original
        uses: actions/checkout@v5
        with:
          repository: zach2good/hyperblade-reference
          ssh-key: ${{ secrets.REFERENCE_DEPLOY_KEY }}
          persist-credentials: false
          path: reference

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Name the original
        shell: bash
        run: |
          printf 'targets:\n  HYPERX:\n    path: %s\n' "$(pwd -W)/reference/HYPERX.EXE" > reccmp-user.yml
          python tools/reference.py

      # The figures assume tools/reccmp_call_table.patch.
      - name: Install reccmp and apply the call-table patch
        shell: bash
        run: |
          set -e
          pip install -r tools/requirements.txt
          SITE=$(python -c "import os, reccmp; print(os.path.dirname(os.path.dirname(reccmp.__file__)))")
          patch -p1 --forward -d "$SITE" < tools/reccmp_call_table.patch

      - name: Build main
        shell: cmd
        run: |
          cmake -S . -B build -DVC6_ROOT=%CD%\vc6 -G "NMake Makefiles" ^
                -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-vc6sp3.cmake ^
                -DCMAKE_BUILD_TYPE=Release ^
                -DCMAKE_MAKE_PROGRAM=%CD%\vc6\VC98\BIN\NMAKE.EXE || exit /b 1
          python tools\cmake_build.py build || exit /b 1

      - name: Score and update the figures
        shell: bash
        run: |
          set -e
          python -m reccmp.tools.asmcmp --target HYPERX --json build/report.json --silent
          python tools/check_readme.py --write
          python tools/status_card.py
          python tools/check_readme.py --strict

      - name: Commit what moved
        shell: bash
        run: |
          set -e
          if git diff --quiet -- README.md progress/status.svg; then
              echo "The figures have not moved"
              exit 0
          fi
          python tools/progress.py --record
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md progress/status.svg progress/history.csv
          git commit -m "Progress: Update figures"
          git push origin HEAD:main
