target-version = "py312"
line-length = 120

[lint]
select = ["F", "E4", "E7", "E9", "W", "I", "UP", "B", "A"]
ignore = [
    "B007",   # Renaming every unused loop variable is churn
    "B023",   # The closures here are re.sub callbacks run inside the iteration
    "B904",   # `from` would change the traceback a failure prints
    "B905",   # zip(strict=) changes behaviour
    "E402",   # Local imports follow a sys.path insert
    "UP031",  # %-formatting is converted only on lines touched anyway
]
